{% if site.author.github %}<a href="{% if site.author.github contains '://' %}{{ site.author.github }}{% else %}https://github.com/{{ site.author.github }}{% endif %}" target="_blank" rel="noopener">GitHub &#8599;</a>{% endif %}
{% if site.author.linkedin %}<a href="{% if site.author.linkedin contains '://' %}{{ site.author.linkedin }}{% else %}https://www.linkedin.com/in/{{ site.author.linkedin }}{% endif %}" target="_blank" rel="noopener">LinkedIn &#8599;</a>{% endif %}
{% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener">Google Scholar &#8599;</a>{% endif %}
{% if site.author.orcid %}<a href="{{ site.author.orcid }}" target="_blank" rel="noopener">ORCID &#8599;</a>{% endif %}
{% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email &#8599;</a>{% endif %}
